# Build settings live here rather than only in the Netlify interface, so that a
# change to them is a diff someone can read. No values belong in this file — it is
# committed, and every secret this project holds is set in the Netlify UI or in a
# local .env that git ignores.

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"
